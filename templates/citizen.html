<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Στρατολογία - Αίτηση Πολίτη</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white text-center py-3">
            <h3 class="mb-0">📝 Φόρμα Δήλωσης Στρατολογίας</h3>
        </div>
        <div class="card-body p-4">
            
            {% if success %}
            <div class="alert alert-success text-center" role="alert">
                🎉 Η αίτησή σας καταχωρήθηκε επιτυχώς! Το status σας είναι: <strong>PENDING</strong>.
            </div>
            {% endif %}

            <form method="POST" action="/citizen">
                <div class="mb-3">
                    <label class="form-label fw-bold">Ονοματεπώνυμο</label>
                    <input type="text" class="form-control" name="full_name" required placeholder="π.χ. Παπαδόπουλος Γεώργιος">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">ΑΜΚΑ (11 ψηφία)</label>
                    <input type="text" class="form-control" name="amka" required maxlength="11" pattern="\d{11}" title="Πρέπει να είναι ακριβώς 11 ψηφία" placeholder="π.χ. 01050212345">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Τύπος Αίτησης</label>
                    <select class="form-select" name="request_type" required>
                        <option value="Κατάταξη">Επιθυμία Κατάταξης (Θητεία)</option>
                        <option value="Αναβολή">Αίτηση Αναβολής</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Επιλογή Σώματος</label>
                    <select class="form-select" name="army_branch" required>
                        <option value="Στρατός Ξηράς">Στρατός Ξηράς 🪖</option>
                        <option value="Πολεμική Αεροπορία">Πολεμική Αεροπορία ✈️</option>
                        <option value="Πολεμικό Ναυτικό">Πολεμικό Ναυτικό ⚓</option>
                    </select>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Υποβολή Αίτησης</button>
                    <a href="/" class="btn btn-outline-secondary">Επιστροφή στην Αρχική</a>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
